<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | GridPulseAI</title>

    <link
        rel="stylesheet"
        href="/static/auth.css"
    >

</head>


<body>

    <div class="auth-page">

        <!-- LEFT SIDE -->
        <div class="auth-brand">

            <div class="brand-content">

                <h1>GridPulseAI</h1>

                <p>
                    AI-Based Energy Consumption
                    Forecasting & Optimization Agent
                </p>

                <div class="brand-line"></div>

                <span>
                    Smarter energy insights.
                    Better decisions.
                </span>

            </div>

        </div>


        <!-- RIGHT SIDE -->
        <div class="auth-section">

            <div class="auth-card">

                <div class="mobile-logo">
                    GridPulseAI
                </div>


                <h2>
                    Welcome back
                </h2>

                <p class="auth-subtitle">
                    Log in to access your energy dashboard
                </p>


                <!-- LOGIN FORM -->

                <form id="loginForm">


                    <!-- EMAIL -->

                    <div class="form-group">

                        <label for="email">
                            Email address
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            required
                        >

                    </div>


                    <!-- PASSWORD -->

                    <div class="form-group">

                        <div class="password-label">

                            <label for="password">
                                Password
                            </label>

                            <a href="/forgot-password">Forgot password?</a>

                        </div>

                        <div class="password-wrapper">

                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Enter your password"
                                required
                            >

                            <button
                                type="button"
                                class="show-password"
                                id="togglePassword"
                            >
                                Show
                            </button>

                        </div>

                    </div>


                    <!-- ERROR MESSAGE -->

                    <div
                        id="loginMessage"
                        class="auth-message"
                    ></div>


                    <!-- LOGIN BUTTON -->

                    <button
                        type="submit"
                        class="login-button"
                        id="loginButton"
                    >
                        Log In
                    </button>


                </form>


                <!-- SIGN UP -->

                <p class="signup-text">

                    Don't have an account?

                    <a href="/signup">
                        Sign up
                    </a>

                </p>


                <div class="auth-footer">

                    GridPulseAI · Smart Energy Management

                </div>

            </div>

        </div>

    </div>


    <script src="/static/auth.js"></script>

</body>

</html>
