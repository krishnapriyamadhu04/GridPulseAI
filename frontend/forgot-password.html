
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | GridPulseAI</title>
    <link rel="stylesheet" href="/static/auth.css">

    <style>
        .recovery-section {
            padding: 30px 40px;
        }

        .recovery-card {
            max-width: 460px;
        }

        .recovery-card .auth-subtitle {
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .recovery-card .form-group {
            margin-bottom: 18px;
        }

        .recovery-card select,
        .recovery-card input {
            width: 100%;
            height: 50px;
            padding: 0 14px;
            border: 1px solid #d0d5dd;
            border-radius: 8px;
            background: white;
            color: #172033;
            font-family: inherit;
            font-size: 15px;
            outline: none;
        }

        .recovery-card input:focus,
        .recovery-card select:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.10);
        }

        .recovery-card .password-wrapper input {
            padding-right: 70px;
        }

        
.question-box {
    margin-top: 10px;
    margin-bottom: 20px;
    padding: 20px;
    border: 1px solid #d0d5dd;
    border-radius: 12px;
    background: #ffffff;
    color: #172033;
    font-size: 16px;
    font-weight: 500;
    line-height: 1.6;
    box-shadow: 0 2px 8px rgba(16, 24, 40, 0.04);
}

        .recovery-card .auth-message {
            overflow-wrap: anywhere;
            margin-top: 8px;
        }

        .recovery-card .signup-text {
            margin-top: 22px;
        }

        [hidden] {
            display: none !important;
        }

        @media (max-width: 800px) {
            .recovery-section {
                padding: 30px 25px;
            }

            .recovery-card .mobile-logo {
                margin-bottom: 24px;
            }
        }
    </style>
</head>

<body>
    <div class="auth-page">

        <!-- LEFT BRAND SECTION -->
        <aside class="auth-brand">
            <div class="brand-content">
                <h1>GridPulseAI</h1>
                <p>
                    AI-Based Energy Consumption
                    Forecasting &amp; Optimization Agent
                </p>
                <div class="brand-line"></div>
                <span>Smarter energy insights. Better decisions.</span>
            </div>
        </aside>

        <!-- RIGHT FORM SECTION -->
        <main class="auth-section recovery-section">
            <div class="auth-card recovery-card">

                <div class="mobile-logo">GridPulseAI</div>

                <h2>Forgot password?</h2>

                <p class="auth-subtitle">
                    Recover your account using your security question
                </p>

                <!-- STEP 1: FIND SECURITY QUESTION -->
                <form id="questionForm">
                    <div class="form-group">
                        <label for="email">Email address</label>
                        <input
                            id="email"
                            type="email"
                            placeholder="Enter your registered email"
                            autocomplete="email"
                            required
                        >
                    </div>

                    <button
                        type="submit"
                        class="login-button"
                        id="questionButton"
                    >
                        Get Security Question
                    </button>
                </form>

                <!-- STEP 2: VERIFY ANSWER AND RESET -->
                <form id="resetForm" hidden>
                    <div class="form-group">
                        <label>Your security question</label>
                        <div class="question-box" id="securityQuestion"></div>
                    </div>

                    <div class="form-group">
                        <label for="securityAnswer">Security answer</label>
                        <input
                            id="securityAnswer"
                            type="text"
                            placeholder="Enter your answer"
                            autocomplete="off"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="newPassword">New password</label>
                        <div class="password-wrapper">
                            <input
                                id="newPassword"
                                type="password"
                                placeholder="At least 8 characters"
                                minlength="8"
                                autocomplete="new-password"
                                required
                            >
                            <button
                                type="button"
                                class="show-password"
                                id="toggleNewPassword"
                                aria-controls="newPassword"
                                aria-pressed="false"
                            >Show</button>
                        </div>
                    </div>
                    
<button
    type="button"
    id="changeEmailButton"
    style="width: 100%; height: 42px; margin: 0 0 12px; background: transparent; color: #2563eb; border: 1px solid #d0d5dd; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer;"
>
    Change email
</button>
                    <button
                        type="submit"
                        class="login-button"
                        id="resetButton"
                    >
                        Reset Password
                    </button>
                </form>

                <div
                    id="message"
                    class="auth-message"
                    role="status"
                    aria-live="polite"
                ></div>

                <p class="signup-text">
                    Remembered your password?
                    <a href="/login">Back to Login</a>
                </p>

                <div class="auth-footer">
                    GridPulseAI · Smart Energy Management
                </div>
            </div>
        </main>
    </div>

    <script>
        const questionForm = document.getElementById("questionForm");
        const resetForm = document.getElementById("resetForm");
        const emailInput = document.getElementById("email");
        const questionText = document.getElementById("securityQuestion");
        const message = document.getElementById("message");
        const questionButton = document.getElementById("questionButton");
        const resetButton = document.getElementById("resetButton");
        const newPasswordInput = document.getElementById("newPassword");
        const toggleNewPassword = document.getElementById("toggleNewPassword");

        let loadedEmail = "";

        function showMessage(text, type = "") {
            message.textContent = text;
            message.className = "auth-message";

            if (type) {
                message.classList.add(type);
            }
        }

        toggleNewPassword.addEventListener("click", () => {
            const isHidden = newPasswordInput.type === "password";

            newPasswordInput.type = isHidden ? "text" : "password";
            toggleNewPassword.textContent = isHidden ? "Hide" : "Show";
            toggleNewPassword.setAttribute("aria-pressed", String(isHidden));
        });

        questionForm.addEventListener("submit", async (event) => {
            event.preventDefault();

            const email = emailInput.value.trim();

            showMessage("");
            resetForm.hidden = true;
            questionButton.disabled = true;
            questionButton.textContent = "Loading...";

            try {
                const response = await fetch("/api/auth/security-question", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ email })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(
                        data.detail || "Could not retrieve security question."
                    );
                }

                const question =
                    data.security_question ||
                    data.securityQuestion ||
                    data.question;

                if (!question) {
                    throw new Error("Security question was not returned.");
                }

            loadedEmail = email;
            questionText.textContent = question;
            resetForm.reset();

            questionForm.hidden = true;
            resetForm.hidden = false;

            showMessage("");
            document.getElementById("securityAnswer").focus();

            } catch (error) {
                showMessage(error.message || "Something went wrong", "error");
            } finally {
                questionButton.disabled = false;
                questionButton.textContent = "Get Security Question";
            }
        });

        document.getElementById("changeEmailButton").addEventListener("click", () => {
        resetForm.hidden = true;
        questionForm.hidden = false;
        showMessage("");
        });

        resetForm.addEventListener("submit", async (event) => {
            event.preventDefault();

            const securityAnswer =
                document.getElementById("securityAnswer").value.trim();
            const newPassword = newPasswordInput.value;

            showMessage("");

            if (newPassword.length < 8) {
                showMessage(
                    "Your new password must be at least 8 characters.",
                    "error"
                );
                return;
            }

            resetButton.disabled = true;
            resetButton.textContent = "Resetting password...";

            try {
                const response = await fetch("/api/auth/forgot-password", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        email: loadedEmail,
                        security_answer: securityAnswer,
                        new_password: newPassword
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(
                        data.detail || "Password reset failed."
                    );
                }

                showMessage(
                    "Password reset successfully. Redirecting to login...",
                    "success"
                );

                questionButton.disabled = true;
                resetButton.textContent = "Password Reset";

                setTimeout(() => {
                    window.location.href = "/login";
                }, 1200);

            } catch (error) {
                showMessage(
                    error.message || "Something went wrong. Please try again.",
                    "error"
                );
                resetButton.disabled = false;
                resetButton.textContent = "Reset Password";
            }
        });
    </script>
</body>
</html>
